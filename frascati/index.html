<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0f0c">
<title>Il Diario del Cardinale</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
@font-face{font-family:"IM Fell English";src:url(vendor/fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IM Fell English";src:url(vendor/fonts/im-fell-english-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(vendor/fonts/alegreya-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(vendor/fonts/alegreya-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(vendor/fonts/alegreya-sans-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

:root{
  --ink:#0a0f0c; --ink-2:#111a14; --ink-3:#1a271f; --line:#2c4234;
  --bone:#ece6d6; --mute:#a7b5a3; --verd:#78b18f; --verd-ink:#08130c;
  --gold:#c8a557; --blood:#d0665a; --wine:#8a2f3d;
  --display:"IM Fell English",Georgia,"Times New Roman",serif;
  --ui:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font-family:var(--ui);font-size:18px;line-height:1.4;overflow:hidden}
::selection{background:var(--verd);color:var(--verd-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
h1,h2,.display{font-family:var(--display);font-weight:400;margin:0}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* controls */
button{font:inherit;font-weight:500;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);color:var(--bone);display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .15s var(--ease),transform .15s var(--ease)}
button:active{transform:scale(.98)}
button.primary{background:var(--verd);border-color:var(--verd);color:var(--verd-ink);font-weight:700}
button.quiet{background:transparent;color:var(--mute)}
button:disabled{opacity:.45;cursor:default;transform:none}
button svg{flex:none}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* start */
#start{padding:calc(28px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;gap:22px}
#start h1{font-size:44px;line-height:1.02;letter-spacing:.005em;text-wrap:balance}
#start .lede{color:var(--mute);margin:6px 0 0}
.team{justify-content:space-between;text-align:left;padding:0 16px;min-height:56px}
.team .display{font-size:22px}
.team small{color:var(--mute);font-size:15px}

/* dialog: figure beside spoken text, no container */
.dialog{display:flex;gap:14px;align-items:flex-start}
.dialog canvas{flex:none;width:80px;height:80px;image-rendering:pixelated}
.dialog .who{font-family:var(--display);color:var(--gold);font-size:17px;margin-bottom:2px}
.dialog .txt{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.38;min-height:3.5em;text-wrap:pretty}
.dialog.plain .txt{font-family:var(--ui);font-style:normal;font-size:17px;min-height:0}

/* game */
#game{position:relative}
#bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:var(--ink-2);border-bottom:1px solid var(--line)}
#bar .team-name{font-family:var(--display);font-size:20px}
#bar .step{color:var(--mute);font-size:15px}
#bar .right{text-align:right}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--verd)}
#pts{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
#map{flex:1 1 38%;min-height:140px;background:var(--ink-2)}
#game.focus #map{flex:0 0 84px;min-height:84px}
#game.focus #panel{flex:1 1 auto;max-height:none}
#panel{flex:0 1 auto;max-height:62%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:var(--ink-2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;margin-top:-14px;position:relative;z-index:500}
.leaflet-container{background:var(--ink-2);font-family:var(--ui)}
.leaflet-control-attribution{background:rgba(10,15,12,.75)!important;color:var(--mute)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--verd)!important}
.leaflet-bar a{background:var(--ink-3);color:var(--bone);border-color:var(--line)}
.me{width:18px;height:18px;border-radius:50%;background:var(--verd);border:3px solid var(--ink);position:relative}
.me::after{content:"";position:absolute;inset:-10px;border:2px solid var(--verd);border-radius:50%;opacity:0;animation:ring 2s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
.sigil{filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.where{font-family:var(--display);font-size:24px;line-height:1.15;margin:0 0 2px}
.dist{color:var(--mute);margin:0 0 14px}
.riddle{margin:0 0 14px;text-wrap:pretty}
.msg{min-height:24px;margin-top:8px}
.msg.ko{color:var(--blood)}.msg.ok{color:var(--verd)}
form.answer{display:flex;gap:10px;margin-top:14px}
form.answer input{flex:1;min-width:0;font:inherit;font-size:20px;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--bone);text-transform:uppercase;letter-spacing:.14em}
form.answer input::placeholder{color:var(--mute);text-transform:none;letter-spacing:0;font-size:17px}
form.answer input:disabled{opacity:.5}
form.answer button{flex:none}

/* hint coins */
.coins{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.coins .left{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:15px}
.coin{width:26px;height:26px}
.coin circle{fill:none;stroke:var(--gold);stroke-width:1.6}
.coin path{fill:var(--gold)}
.coin.spent circle{stroke:var(--line)}.coin.spent path{fill:var(--line)}
.hintlist{display:grid;gap:12px;margin-top:14px}

/* seal: the one authored moment */
.seal{display:flex;align-items:center;gap:16px;margin:4px 0 16px}
.seal svg{width:84px;height:84px;flex:none;transform-origin:center;animation:stamp .55s var(--ease) both}
@keyframes stamp{0%{transform:scale(1.5) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
.seal .word{font-family:var(--display);font-size:30px;line-height:1.1}
.seal .sub{color:var(--mute);font-size:16px}

/* minigames */
.mg{margin:0 0 6px}
.mg .cap{color:var(--mute);font-size:15px;margin:8px 0 0;text-align:center}
#tiles{display:block;width:100%;max-width:300px;aspect-ratio:1;margin:0 auto;border-radius:10px;border:1px solid var(--line);touch-action:manipulation;image-rendering:pixelated}
.dial{display:block;width:100%;max-width:300px;margin:0 auto;touch-action:none;user-select:none}
.dial text{font-family:var(--display);fill:var(--bone)}
.dial .in text{fill:var(--gold)}
#ring{transform-origin:150px 150px;transition:transform .18s var(--ease)}
#ring.drag{transition:none}
.decode{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 4px;font-family:var(--display);font-size:26px;letter-spacing:.18em}
.decode .a{color:var(--mute)}
.decode .b{color:var(--bone)}
.dialctl{display:flex;justify-content:center;gap:10px}
.dialctl button{width:64px;padding:0}

.drums{display:flex;justify-content:center;gap:10px;margin:8px 0}
.drum{display:grid;justify-items:center;gap:4px}
.drum button{width:56px;min-height:44px;padding:0}
.drum .face{width:56px;height:68px;display:flex;align-items:center;justify-content:center;background:var(--ink);border:2px solid var(--line);border-radius:8px;font-family:var(--ui);font-weight:700;font-size:34px;color:var(--gold);box-shadow:inset 0 10px 14px -8px #000,inset 0 -10px 14px -8px #000;transition:transform .12s var(--ease)}
.drum .face.tick{transform:translateY(-3px)}
.clues{margin:0 0 6px;padding-left:20px;color:var(--bone);font-size:17px;line-height:1.5}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.drums.won .face{border-color:var(--verd);color:var(--verd)}
.dial .in text.hit{fill:var(--verd);font-weight:700}
@media(prefers-reduced-motion:reduce){.shake,.drum .face{animation:none;transition:none}}
.barrels{display:flex;justify-content:center;gap:28px;align-items:flex-end;margin:6px 0 10px}
.barrel{display:grid;justify-items:center;gap:6px;width:112px}
.vessel{position:relative;width:78px;border:2px solid var(--line);border-radius:6px 6px 12px 12px;background:var(--ink);overflow:hidden}
.vessel .wine{position:absolute;left:0;right:0;bottom:0;background:var(--wine);transition:height .35s var(--ease)}
.vessel .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-weight:700;font-size:28px;color:var(--bone)}
.barrel .name{color:var(--mute);font-size:15px}
.barrel button{min-height:44px;width:100%;font-size:16px;padding:0 8px}
.won{color:var(--verd)}

/* finale */
#fine{padding:calc(28px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;gap:20px}
#fine h1{font-size:40px;line-height:1.05}
.final{display:flex;gap:28px;align-items:baseline}
.final .big{font-family:var(--ui);font-weight:500;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.final .lab{color:var(--mute);font-size:15px}
body.glitch #game{animation:shake .45s var(--ease);filter:hue-rotate(110deg) contrast(1.2)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* sanità */
#san{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
#san.basso{color:var(--blood)}
body.turbato .dialog .txt,body.turbato .riddle{animation:trem 3.2s infinite}
@keyframes trem{0%,90%,100%{transform:none;text-shadow:none}93%{transform:translateX(1px);text-shadow:-2px 0 var(--wine)}96%{transform:translateX(-1px);text-shadow:2px 0 var(--verd)}}
body.folle::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1500;background:radial-gradient(ellipse at center,transparent 50%,rgba(138,47,61,.45) 100%);animation:pulsa 4s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.35}}
.segue{font-family:var(--display);font-style:italic;color:var(--blood);margin:-8px 0 14px}

/* reliquie */
.inv{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.inv .lab{width:100%;color:var(--mute);font-size:15px}
.inv button{min-height:40px;padding:0 12px;font-size:15px;border-color:var(--gold);color:var(--gold);background:transparent}
.inv span.it{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;color:var(--mute)}

/* cutscene */
#cut{position:fixed;inset:0;z-index:4000;background:#000;display:none;flex-direction:column;align-items:center}
#cut.on{display:flex}
#cutc{height:min(58dvh,133vw);aspect-ratio:3/4;width:auto;max-width:100%;image-rendering:pixelated;margin-top:env(safe-area-inset-top);background:#000}
#cutskip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:2;min-height:40px;padding:0 14px;font-size:15px;background:rgba(10,15,12,.6)}
#cuttxt{flex:1;width:100%;max-width:440px;padding:14px 22px 0;overflow:auto;font-family:var(--display);font-style:italic;font-size:20px;line-height:1.35;text-wrap:pretty}
#cuttxt p{margin:0 0 8px;color:var(--mute)}
#cuttxt p.nuova{color:var(--bone);animation:appari .6s var(--ease)}
@keyframes appari{from{opacity:0;transform:translateY(6px)}}
.cutbar{width:100%;max-width:440px;padding:10px 22px calc(18px + env(safe-area-inset-bottom))}
.cutbar button{width:100%}

/* combattimento */
#lotta{position:fixed;inset:0;z-index:3000;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#lotta.on{display:block}
#lv,#lspr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;background:#000}
#lspr{display:none;object-fit:contain;padding:30% 20%}
#lotta.nofilm #lspr{display:block}#lotta.nofilm #lv{visibility:hidden}
#lotta.colpo{animation:shake .45s var(--ease)}
#lotta::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--blood);opacity:0;transition:opacity .25s}
#lotta.rosso::after{opacity:.45}
.lhud{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(12px + env(safe-area-inset-top)) 16px 28px;display:flex;justify-content:space-between;align-items:baseline;background:linear-gradient(rgba(0,0,0,.8),transparent)}
.lhud .n{font-family:var(--display);font-size:22px}
.lhud .s{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
#lcue{position:absolute;z-index:2;left:50%;top:46%;width:136px;height:136px;margin:-68px 0 0 -68px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(10,15,12,.55);border:3px solid var(--gold);color:var(--gold);animation:cue .45s infinite alternate}
#lcue.on{display:flex}
#lcue svg{width:76px;height:76px}
@keyframes cue{to{transform:scale(1.08);box-shadow:0 0 34px var(--gold)}}
#lsub{position:absolute;z-index:2;left:16px;right:16px;bottom:calc(46px + env(safe-area-inset-bottom));text-align:center;font-family:var(--display);font-style:italic;font-size:24px;text-shadow:0 2px 8px #000,0 0 2px #000;min-height:1.3em}
#lbar{position:absolute;z-index:2;left:16px;right:16px;bottom:calc(26px + env(safe-area-inset-bottom));height:6px;border-radius:3px;background:rgba(255,255,255,.15);visibility:hidden}
#lbar.on{visibility:visible}
#lbar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:3px}
.lcard{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:64px 20px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.92) 30%);display:none;gap:12px}
.lcard.on{display:grid}
.lcard h2{font-size:32px;line-height:1.05}
.lcard p{margin:0;color:var(--mute)}
.lcard .fr{font-family:var(--display);font-style:italic;color:var(--bone);font-size:19px}
.lcard .mosse{display:flex;gap:14px;color:var(--gold);align-items:center;font-size:15px}
.lcard .mosse svg{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="start" class="screen on">
  <div>
    <h1>Il Diario del Cardinale</h1>
    <p class="lede">Una caccia notturna per le strade di Frascati.</p>
  </div>
  <div class="dialog"><canvas id="sprIntro" width="16" height="16" aria-hidden="true"></canvas>
    <div><div class="who">Il Cardinale</div><div class="txt" id="introTxt"></div></div></div>
  <button id="introAudio" class="quiet" style="align-self:flex-start"></button>
  <div>
    <h2 style="font-size:26px;margin-bottom:12px">Scegliete la squadra</h2>
    <div class="stack" id="teams"></div>
  </div>
</div>

<div id="game" class="screen">
  <div id="bar">
    <div><div class="team-name" id="barTeam"></div><div class="step" id="barStep"></div></div>
    <div style="display:flex;gap:4px"><button id="mus" class="quiet" aria-label="Musica" aria-pressed="true" style="min-height:40px;width:44px;padding:0"></button>
    <button id="rst" class="quiet" aria-label="Ricomincia la partita" style="min-height:40px;width:44px;padding:0"></button></div>
    <div class="right"><div id="timer">00:00</div><div id="pts">0 punti</div><div id="san">Sanità 100</div></div>
  </div>
  <div id="map"></div>
  <div id="panel"></div>
</div>

<div id="fine" class="screen">
  <h1>La Porta è chiusa</h1>
  <div class="display" id="fineTeam" style="font-size:24px"></div>
  <div class="final">
    <div><div class="big" id="fineTime"></div><div class="lab">tempo con penalità</div></div>
    <div><div class="big" id="finePts" style="color:var(--gold)"></div><div class="lab" id="fineLab">punti</div></div>
  </div>
  <div class="dialog"><canvas id="sprFine" width="16" height="16" aria-hidden="true"></canvas>
    <div><div class="who">Il Cardinale</div><div class="txt" id="fineTxt"></div></div></div>
  <div class="row"><button id="fineAudio" class="quiet"></button><button id="restart" class="quiet">Ricomincia</button></div>
</div>

<div id="cut" role="dialog" aria-label="Scena">
  <button id="cutskip" class="quiet">Salta</button>
  <canvas id="cutc" width="120" height="160" aria-hidden="true"></canvas>
  <div id="cuttxt" aria-live="polite"></div>
  <div class="cutbar"><button id="cutgo" class="primary">Continua</button></div>
</div>

<div id="lotta" aria-live="polite">
  <video id="lv" playsinline webkit-playsinline preload="auto"></video>
  <canvas id="lspr" width="16" height="16" aria-hidden="true"></canvas>
  <div class="lhud"><span class="n" id="lnome"></span><span class="s" id="lsan"></span></div>
  <button id="lbypass" class="quiet" style="display:none;position:absolute;z-index:4;top:calc(52px + env(safe-area-inset-top));right:12px;min-height:38px;padding:0 12px;font-size:14px;border-color:var(--gold);color:var(--gold);background:rgba(10,15,12,.7)">Test: salta lo scontro</button>
  <div id="lcue" role="img"></div>
  <div id="lsub"></div>
  <div id="lbar"><i></i></div>
  <div class="lcard" id="lcard"></div>
</div>

<script src="vendor/leaflet.js"></script>
<script>
/* ---------- Icone ---------- */
const IC={
 speaker:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 mute:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
 restart:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>',
 left:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
 coin:s=>`<svg class="coin${s?' spent':''}" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11"/><path d="M13 6l5 7-5 7-5-7z"/></svg>`,
 sigil:'<svg class="sigil" viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="18" fill="#0a0f0c" stroke="#c8a557" stroke-width="2"/><path d="M22 9l12 21H10z" fill="none" stroke="#c8a557" stroke-width="2" stroke-linejoin="round"/><circle cx="22" cy="23.5" r="3.2" fill="#c8a557"/></svg>',
 dir:m=>{const r={sinistra:180,destra:0,su:270,giu:90}[m];
   if(m==='tocco')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M6 9h12"/></svg>';
   return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(${r}deg)"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`;},

};

const KEY='diario_cardinale_v2';
let fake=false,D,S,map,meMarker,targetMarker,targetCircle,lastPos=null,typeTimer=null,audioEl=null,timerOn=false;
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\b(l|il|lo|la|un|una)\b/g,' ').replace(/\s+/g,' ').trim();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const elapsed=()=>Date.now()-S.start+S.pen*1000;
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- Audio ---------- */
function stopAudio(){if(audioEl){audioEl.pause();audioEl=null;}if('speechSynthesis' in window)speechSynthesis.cancel();duck(false);}
function speak(id,testo,chi){
  stopAudio();const a=new Audio('audio/'+id+'.mp3');audioEl=a;
  a.onplay=()=>duck(true);a.onended=()=>duck(false);
  a.onerror=()=>{if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(testo);u.lang='it-IT';
    u.pitch=chi==='ombra'?0.3:chi==='custode'?0.7:0.9;u.rate=chi==='ombra'?0.8:0.95;u.onstart=()=>duck(true);u.onend=u.onerror=()=>duck(false);speechSynthesis.speak(u);};
  a.play().catch(()=>{});
}
function typewriter(el,text,done){clearInterval(typeTimer);let i=0;el.textContent='';
  typeTimer=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);done&&done();}},22);
  el.onclick=()=>{clearInterval(typeTimer);el.textContent=text;done&&done();};}
function glitch(){document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),450);}
const listenBtn=(el,fn)=>{el.innerHTML=IC.speaker+'<span>Ascolta</span>';el.onclick=fn;};

/* ---------- Avvio ---------- */
fetch('storia.json').then(r=>r.json()).then(init);
function init(data){
  D=data;aggiornaMus();draw($('#sprIntro'),'cardinale');draw($('#sprFine'),'cardinale');
  $('#introTxt').textContent=D.intro.testo;
  listenBtn($('#introAudio'),()=>speak(D.intro.id,D.intro.testo,'cardinale'));
  D.squadre.forEach((t,i)=>{const b=document.createElement('button');b.className='team';
    b.innerHTML=`<span class="display">${t.nome}</span><small>tappe ${t.ordine.join(' · ')}</small>`;
    b.onclick=()=>iniziaSquadra(i);$('#teams').appendChild(b);});
  $('#restart').onclick=ricomincia;
  const prev=localStorage.getItem(KEY);if(prev){S=JSON.parse(prev);entraGioco();}
}
function iniziaSquadra(i){stopAudio();
  S={team:i,idx:0,phase:'viaggio',start:Date.now(),pen:0,pts:0,hn:0,hl:0,er:0,mg:{},lettere:{},done:false,
    san:D.sanita.iniziale,inv:{},lotte:{},d0:{}};save();cutscene('intro',entraGioco);}
/* partite salvate prima dei mostri */
function completaStato(){S.san??=D.sanita.iniziale;S.inv??={};S.lotte??={};S.d0??={};S.hl??=0;}
const stops=()=>[...D.squadre[S.team].ordine.map(n=>D.tappe.find(x=>x.n===n)),D.finale];
const cur=()=>stops()[S.idx];

function entraGioco(){
  completaStato();if(S.done)return mostraFine();
  $('#start').classList.remove('on');$('#fine').classList.remove('on');$('#game').classList.add('on');
  $('#barTeam').textContent=D.squadre[S.team].nome;
  if(!timerOn){timerOn=true;setInterval(()=>{if(!S||S.done)return;$('#timer').textContent=fmt(elapsed());$('#pts').textContent=S.pts+' punti';aggiornaSanita();},500);}
  if(!map)creaMappa();
  render();
}

/* ---------- Mappa ---------- */
function creaMappa(){
  map=L.map('map',{zoomControl:true}).setView(D.centro,16);
  L.tileLayer(D.mappa.url,{maxZoom:19,attribution:D.mappa.attribuzione}).addTo(map);
  map.getPane('tilePane').style.filter=D.mappa.filtro;
  if(TEST)map.on('click',e=>L.popup().setLatLng(e.latlng).setContent(`<b>${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}</b>`).openOn(map));
  if('geolocation' in navigator){
    navigator.geolocation.watchPosition(p=>{if(fake)return;lastPos=[p.coords.latitude,p.coords.longitude];posaMe();aggiornaDistanza();},
      ()=>{const m=$('#gpsmsg');if(m)m.textContent='GPS non disponibile: usate la conferma manuale.';},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  }
}
function posaMe(){if(!lastPos)return;
  if(!meMarker)meMarker=L.marker(lastPos,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18]})}).addTo(map);
  else meMarker.setLatLng(lastPos);}
function mostraTarget(){
  const t=cur();if(targetMarker){map.removeLayer(targetMarker);map.removeLayer(targetCircle);}
  targetMarker=L.marker([t.lat,t.lng],{icon:L.divIcon({className:'',html:IC.sigil,iconSize:[44,44],iconAnchor:[22,22]})}).addTo(map);
  targetCircle=L.circle([t.lat,t.lng],{radius:t.raggio,color:'#78b18f',weight:1.5,fillColor:'#78b18f',fillOpacity:.07}).addTo(map);
  if(lastPos)map.fitBounds([lastPos,[t.lat,t.lng]],{padding:[40,40],maxZoom:18});else map.setView([t.lat,t.lng],17);
}
function aggiornaDistanza(){
  if(!S||S.phase!=='viaggio')return;const t=cur(),el=$('#dist'),btn=$('#arrivo');if(!el||!lastPos)return;
  const d=dist(lastPos[0],lastPos[1],t.lat,t.lng);
  el.textContent=d>=1000?(d/1000).toFixed(1).replace('.',',')+' km da qui':Math.round(d)+' m da qui';
  btn.disabled=!(d<=t.raggio);btn.textContent=d<=t.raggio?'Siete arrivati: aprite il frammento':'Raggiungete il sigillo sulla mappa';
  /* il mostro della tratta compare a metà strada circa */
  const m=mostroTratta();if(!m||lottaAperta)return;
  if(S.d0[S.idx]===undefined){S.d0[S.idx]=d;save();}
  const d0=S.d0[S.idx];
  if(d0>t.raggio*1.5&&d<=d0*0.55&&d>t.raggio)apriLotta(m,()=>render());
}

/* ---------- Pannello ---------- */
function render(){
  const t=cur(),p=$('#panel');stopAudio();
  $('#barStep').textContent=S.idx<D.tappe.length?`Tappa ${S.idx+1} di ${D.tappe.length}`:'Finale';
  $('#timer').textContent=fmt(elapsed());$('#pts').textContent=S.pts+' punti';
  $('#game').classList.toggle('focus',S.phase==='enigma');setTimeout(()=>map&&map.invalidateSize(),60);

    p.innerHTML=`<h2 class="where">${t.luogo}</h2><p class="dist" id="dist">In attesa del GPS…</p>
      ${mostroTratta()?'<p class="segue">Qualcosa vi segue lungo la strada.</p>':''}
      <div class="stack"><button class="primary" id="arrivo" disabled>Raggiungete il sigillo sulla mappa</button>
      <button class="quiet" id="manuale">Il GPS non va: confermo io</button>
      ${TEST?'<button class="quiet" id="sim">Test: simula di essere qui</button><button class="quiet" id="reset">Test: azzera partita</button>':''}
      ${TEST&&mostroTratta()?'<button class="quiet" id="tmostro">Test: fai apparire il mostro</button>':''}
      ${TEST?'<div class="row" style="flex-wrap:wrap">'+Object.keys(SCENE).map(k=>`<button class="quiet tcut" data-c="${k}" style="flex:1 0 30%;min-height:40px;padding:0 6px">Scena ${k}</button>`).join('')+'</div>':''}</div>
      <p class="msg" id="gpsmsg" style="color:var(--mute);font-size:15px"></p><div id="inv"></div>${ver}`;
    inventario();
    if(TEST&&mostroTratta())$('#tmostro').onclick=()=>apriLotta(mostroTratta(),()=>render());
    if(TEST)document.querySelectorAll('.tcut').forEach(b=>b.onclick=()=>cutscene(b.dataset.c));
    $('#arrivo').onclick=vaiScena;$('#manuale').onclick=vaiScena;
    if(TEST){fake=false;$('#sim').onclick=()=>{fake=true;lastPos=[t.lat,t.lng];posaMe();map.setView(lastPos,18);aggiornaDistanza();};
      $('#reset').onclick=()=>{localStorage.removeItem(KEY);location.reload();};}
    aggiornaDistanza();
  } else if(S.phase==='scena'){
    p.innerHTML=`<div class="dialog"><canvas id="spr" width="16" height="16" aria-hidden="true"></canvas>
      <div><div class="who">${NOMI[t.personaggio]}</div><div class="txt" id="txt" aria-live="polite"></div></div></div>
      <div class="row" style="margin-top:16px"><button class="quiet" id="ascolta"></button><button class="primary" id="avanti" disabled>Continua</button></div>${ver}`;
    draw($('#spr'),t.personaggio);typewriter($('#txt'),t.frammento,()=>{$('#avanti').disabled=false;});
    speak(t.id+'_frammento',t.frammento,t.personaggio);
    listenBtn($('#ascolta'),()=>speak(t.id+'_frammento',t.frammento,t.personaggio));
    $('#avanti').onclick=()=>{S.phase='enigma';save();render();};
  } else if(S.phase==='enigma'){renderEnigma(p,t,ver);}
  else if(S.phase==='risolta'){
    const fin=S.idx===D.tappe.length,guad=S.ultimi||0;
    p.innerHTML=`<div class="seal">${IC.seal(fin?'✦':t.lettera)}<div><div class="word">${fin?'La Porta si chiude':t.risposte[0].toUpperCase()}</div>
      <div class="sub">${fin?'Dite la parola tutti insieme.':'Segnatevi la lettera '+t.lettera+': servirà al finale.'} +${guad} punti</div></div></div>
      <button class="primary" id="next" style="width:100%">${fin?"Aprite l'ultimo frammento":'Prossima tappa'}</button>`;
    $('#next').onclick=avanza;
  }
}
function vaiScena(){const m=mostroTratta();
  if(m)return apriLotta(m,()=>{S.phase='scena';save();render();},true);
  S.phase='scena';save();render();}

function renderEnigma(p,t,ver){
  const gated=['tessere','barili','lucchetto','specchio'].includes(t.gioco)&&!(S.mg[t.id]&&S.mg[t.id].solved);
  const fin=S.idx===D.tappe.length;
  const lett=fin?`<p class="dist" style="margin:0 0 6px">Lettere raccolte, nell'ordine in cui le avete trovate:</p>
    <div class="display" style="font-size:30px;letter-spacing:.3em;margin-bottom:12px">${Object.values(S.lettere).join('')}</div>`:'';
  p.innerHTML=`<p class="riddle">${t.enigma}</p><div class="mg" id="mg"></div>${TEST?'<button class="quiet" id="bypass" style="width:100%;margin-bottom:10px;border-color:var(--gold);color:var(--gold)">Test: salta questo gioco</button>':''}${lett}
    <form class="answer" id="f"><input type="text" id="ans" autocomplete="off" autocapitalize="characters" aria-label="La risposta" placeholder="${gated?'Prima risolvete il puzzle':'La risposta'}" ${gated?'disabled':''}>
      <button class="primary" id="check" ${gated?'disabled':''}>Controlla</button></form>
    <div class="msg" id="msg" role="status"></div>
    <div class="coins"><div class="left" id="coins"></div><button id="hint"></button></div>
    <div class="hintlist" id="hintbox"></div><div id="inv"></div>${ver}`;
  inventario();
  $('#f').onsubmit=e=>{e.preventDefault();controlla();};
  $('#hint').onclick=usaMoneta;
  if(TEST)$('#bypass').onclick=()=>{const st=S.mg[t.id]||(S.mg[t.id]={});st.solved=true;save();
    const a=$('#ans');a.disabled=false;a.value=t.risposte[0];$('#check').disabled=false;controlla();};
  aggiornaMonete();
  for(let i=0;i<S.hn;i++)mostraHint(i,false);
  const mg=$('#mg');
  if(t.gioco==='tessere')mountTessere(mg,t);else if(t.gioco==='ruota')mountRuota(mg,t);else if(t.gioco==='barili')mountBarili(mg,t);else if(t.gioco==='lucchetto')mountLucchetto(mg,t);else if(t.gioco==='specchio')mountSpecchio(mg,t);
}
function sbloccaInput(){const a=$('#ans');if(!a)return;a.disabled=false;a.placeholder='La risposta';$('#check').disabled=false;a.focus({preventScroll:true});}

/* suggerimenti (monete) */
function aggiornaMonete(){const t=cur(),tot=t.suggerimenti.length;
  $('#coins').innerHTML=Array.from({length:tot},(_,i)=>IC.coin(i<S.hn)).join('')+`<span>${tot-S.hn} su ${tot}</span>`;
  const b=$('#hint');b.textContent=S.hn>=tot?'Monete finite':'Usa una moneta';b.disabled=S.hn>=tot;}
function usaMoneta(){const t=cur();if(S.hn>=t.suggerimenti.length)return;
  S.pen+=D.penalita.suggerimento;S.hn++;save();mostraHint(S.hn-1,true);aggiornaMonete();inventario();}
function usaLanterna(){const t=cur();if(!(S.inv.lanterna>0)||S.hn>=t.suggerimenti.length)return;
  S.inv.lanterna--;S.hn++;S.hl++;save();mostraHint(S.hn-1,true);aggiornaMonete();inventario();}
function mostraHint(i,parla){const t=cur();
  const el=document.createElement('div');el.className='dialog plain';
  el.innerHTML=`<canvas width="16" height="16" aria-hidden="true"></canvas><div><div class="who">Il Custode</div><div class="txt"></div></div>`;
  draw(el.querySelector('canvas'),'custode');el.querySelector('.txt').textContent=t.suggerimenti[i];
  $('#hintbox').appendChild(el);
  if(parla){speak(t.id+'_sugg'+(i+1),t.suggerimenti[i],'custode');el.scrollIntoView({block:'nearest',behavior:'smooth'});}}

function controlla(){
  const t=cur(),v=norm($('#ans').value);if(!v)return;
  const ok=t.risposte.map(norm).some(r=>v===r||v.split(' ').includes(r));
  if(ok){const g=Math.max(0,D.punti.base-D.punti.suggerimento*(S.hn-S.hl)-D.punti.errore*S.er);
    S.pts+=g;S.ultimi=g;S.phase='risolta';if(t.lettera)S.lettere[t.n]=t.lettera;save();render();}
  else{S.pen+=D.penalita.errore;S.er++;perdiSanita(D.sanita.errore);save();glitch();
    const m=$('#msg');m.className='msg ko';m.textContent=`No. Penalità di ${D.penalita.errore/60} minuto, Sanità -${D.sanita.errore}.`;$('#ans').select();}
}
function avanza(){
  if(S.idx===D.tappe.length)return cutscene('finale',()=>{S.done=true;S.final=elapsed();save();mostraFine();});
  const id=cur().id;
  cutscene(id,()=>{S.idx++;S.phase='viaggio';S.hn=0;S.hl=0;S.er=0;save();render();});
}
function mostraFine(){
  $('#game').classList.remove('on');$('#start').classList.remove('on');$('#fine').classList.add('on');
  $('#fineTeam').textContent='Squadra '+D.squadre[S.team].nome;
  $('#fineTime').textContent=fmt(S.final||elapsed());$('#finePts').textContent=S.pts+S.san;
  $('#fineLab').textContent=`punti (${S.pts} + ${S.san} di sanità)`;
  $('#fineTxt').textContent=D.chiusura.testo;musicaStato();
  listenBtn($('#fineAudio'),()=>speak(D.chiusura.id,D.chiusura.testo,'cardinale'));
  speak(D.chiusura.id,D.chiusura.testo,'cardinale');
}

/* ================= Sanità e reliquie ================= */
function aggiornaSanita(){if(!S)return;const el=$('#san');if(el){el.textContent='Sanità '+S.san;el.classList.toggle('basso',S.san<30);}
  document.body.classList.toggle('turbato',S.san<60);document.body.classList.toggle('folle',S.san<30);}
function perdiSanita(n){S.san=Math.max(0,S.san-n);aggiornaSanita();}
setInterval(()=>{if(S&&!S.done&&S.san<30&&!lottaAperta&&Math.random()<.5)glitch();},40000);
function inventario(){const el=$('#inv');if(!el)return;const R=D.reliquie,inv=S.inv||{};
  const ks=Object.keys(R).filter(k=>inv[k]>0);if(!ks.length){el.innerHTML='';return;}
  el.className='inv';
  el.innerHTML='<div class="lab">Reliquie</div>'+ks.map(k=>{const n=inv[k]>1?' ×'+inv[k]:'';
    if(k==='rosario'&&S.san<D.sanita.iniziale)return `<button data-r="rosario" title="${R[k].desc}">${R[k].nome}${n}: usa</button>`;
    if(k==='lanterna'&&S.phase==='enigma'&&S.hn<cur().suggerimenti.length)return `<button data-r="lanterna" title="${R[k].desc}">${R[k].nome}${n}: suggerimento gratis</button>`;
    return `<span class="it" title="${R[k].desc}">${R[k].nome}${n}</span>`;}).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.r==='rosario'){S.inv.rosario--;S.san=Math.min(D.sanita.iniziale,S.san+R.rosario.valore);save();aggiornaSanita();inventario();}
    else if(b.dataset.r==='lanterna')usaLanterna();};
}

/* ================= Combattimenti a film interattivo ================= */
/* Ogni mostro: intro → [momento decisivo → ok_N] … → vittoria. Errore o tempo scaduto → ko, Sanità persa, si riprova.
   Dopo sconfitte_max sconfitte la squadra fugge. Il gioco non si blocca mai: se un video manca, si vede lo sprite. */
let lottaAperta=false,LT=null;const clipCache={};
const mostroTratta=()=>{if(!S||S.done)return null;const id=(D.squadre[S.team].mostri||{})[S.idx];
  if(!id||S.lotte[S.idx])return null;return D.mostri.find(m=>m.id===id)||null;};
const clipUrl=(m,f)=>m.cartella+f;
function preparaClip(m){[m.intro,m.ko,m.vittoria,...m.passi.flatMap(p=>[p.ok,p.ko,p.attesa])].filter(Boolean).forEach(f=>{
  const u=clipUrl(m,f);if(clipCache[u])return;clipCache[u]='…';
  fetch(u).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>{clipCache[u]=URL.createObjectURL(b);}).catch(()=>{delete clipCache[u];});});}
function suono(tipo){if(campione(tipo))return;tipo=({porta:'ko'})[tipo]||tipo;try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const t0=_ac.currentTime,o=_ac.createOscillator(),g=_ac.createGain();
  const P={segno:[660,880,.12,.08,'triangle'],ok:[520,1040,.18,.08,'sine'],ko:[160,40,.5,.2,'sawtooth']}[tipo];
  o.type=P[4];o.frequency.setValueAtTime(P[0],t0);o.frequency.exponentialRampToValueAtTime(P[1],t0+P[2]);
  g.gain.setValueAtTime(P[3],t0);g.gain.exponentialRampToValueAtTime(.0001,t0+P[2]+.05);o.connect(g);g.connect(_ac.destination);o.start();o.stop(t0+P[2]+.1);}catch(e){}}
const vibra=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

function apriLotta(m,dopo,allArrivo){
  if(lottaAperta)return;lottaAperta=true;stopAudio();preparaClip(m);
  LT={m,dopo,i:0,ko:0,aperta:false,timer:null,chiuso:false};musicaStato();campione('ruggito',.9);
  const by=$('#lbypass');by.style.display=TEST?'':'none';
  by.onclick=()=>{if(!LT||LT.chiuso||S.lotte[S.idx])return;LT.chiuso=true;chiudiFinestra();const v=$('#lv');v.pause();sub('');carta('');esito('vinto');};
  const o=$('#lotta');o.classList.add('on');o.classList.remove('nofilm','rosso');
  $('#lnome').textContent=m.nome;lsan();draw($('#lspr'),m.id);
  const v=$('#lv');v.removeAttribute('src');v.load();
  vibra([80,60,80]);
  const mosse=[...new Set(m.passi.map(p=>p.mossa))].map(IC.dir).join('');
  carta(`<h2>${allArrivo?'Vi sbarra la porta':'Qualcosa vi sbarra la strada'}</h2>
    <p class="fr">${m.frase}</p>
    <p>Quando compare il segno, scorrete il dito in quella direzione. La croce vuol dire: toccate lo schermo. Avete poco più di un secondo.</p>
    <div class="mosse">${mosse}</div>
    <button class="primary" id="laff">Affrontatelo</button>
    ${S.inv.sale>0?`<button class="quiet" id="lsale">Gettate il ${D.reliquie.sale.nome.toLowerCase()} e passate</button>`:''}`);
  speak('mostro_'+m.id,m.frase,'ombra');
  $('#laff').onclick=()=>{stopAudio();carta('');sub('');gioca(m.intro,()=>decisione(0));};
  if(S.inv.sale>0)$('#lsale').onclick=()=>{S.inv.sale--;esito('sale');};
}
function lsan(){$('#lsan').textContent='Sanità '+S.san;}
function carta(html){const c=$('#lcard');c.innerHTML=html;c.classList.toggle('on',!!html);}
function sub(t){$('#lsub').textContent=t||'';}
function gioca(f,fatto){
  const o=$('#lotta'),v=$('#lv');let finito=false;const fine=()=>{if(finito||!LT||LT.chiuso)return;finito=true;v.onended=v.onerror=null;fatto();};
  if(!f){setTimeout(fine,200);return;}
  const u=clipUrl(LT.m,f),src=clipCache[u]&&clipCache[u]!=='…'?clipCache[u]:u;
  const ripiego=()=>{o.classList.add('nofilm');o.classList.remove('colpo');void o.offsetWidth;o.classList.add('colpo');setTimeout(fine,1200);};
  o.classList.remove('nofilm');v.loop=false;v.onended=fine;v.onerror=ripiego;v.src=src;
  const pr=v.play();if(pr)pr.catch(()=>{v.muted=true;v.play().catch(ripiego);});
}
function finestra(p){/* con poca sanità si ha meno tempo: fino al 70% */
  return Math.round((p.finestra||1500)*(0.7+0.3*S.san/D.sanita.iniziale)*(TEST&&new URLSearchParams(location.search).has('lento')?3:1));}
function decisione(i){
  LT.i=i;const p=LT.m.passi[i],ms=finestra(p),v=$('#lv');
  if(p.attesa){v.loop=true;v.src=clipCache[clipUrl(LT.m,p.attesa)]||clipUrl(LT.m,p.attesa);v.play().catch(()=>{});}
  const c=$('#lcue');c.innerHTML=IC.dir(p.mossa);c.setAttribute('aria-label',p.mossa==='tocco'?'Toccate':'Scorrete '+(p.mossa==='giu'?'giù':'verso '+p.mossa));c.classList.add('on');
  sub(p.testo);suono('segno');vibra(30);
  const b=$('#lbar'),bi=b.querySelector('i');b.classList.add('on');bi.style.transition='none';bi.style.width='100%';void bi.offsetWidth;
  bi.style.transition=`width ${ms}ms linear`;bi.style.width='0%';
  LT.aperta=true;LT.timer=setTimeout(()=>mossa('tempo'),ms);
}
function chiudiFinestra(){LT.aperta=false;clearTimeout(LT.timer);$('#lcue').classList.remove('on');$('#lbar').classList.remove('on');}
function mossa(g){
  if(!LT||!LT.aperta)return;chiudiFinestra();const m=LT.m,i=LT.i,p=m.passi[i],ultimo=i===m.passi.length-1;
  if(g===p.mossa){suono('ok');vibra(20);sub('');
    const poi=()=>ultimo?gioca(m.vittoria,()=>esito('vinto')):decisione(i+1);
    if(p.ok)gioca(p.ok,poi);else poi();return;}
  /* sconfitta */
  suono('ko');vibra([200,80,300]);LT.ko++;perdiSanita(m.sanita_ko);save();lsan();
  sub(g==='tempo'?'Troppo lenti.':'Mossa sbagliata.');
  const o=$('#lotta');o.classList.add('rosso');setTimeout(()=>o.classList.remove('rosso'),600);
  gioca(p.ko||m.ko,()=>{sub('');
    if(LT.ko>=(m.sconfitte_max||2))return esito('fuga');
    carta(`<h2>Vi ha preso</h2><p>Sanità -${m.sanita_ko}. Ancora una sconfitta e dovrete fuggire.</p>
      <button class="primary" id="lrip">Di nuovo</button>`);
    $('#lrip').onclick=()=>{carta('');gioca(i===0?m.intro:m.passi[i-1].ok,()=>decisione(i));};});
}
function esito(e){
  const m=LT.m,R=D.reliquie;S.lotte[S.idx]=e;let h;
  if(e==='vinto'){S.pts+=m.punti||0;S.inv[m.premio]=(S.inv[m.premio]||0)+1;
    h=`<h2>${m.nome} è sconfitto</h2><p class="fr">${m.esito_vinto}</p><p>+${m.punti||0} punti. Reliquia: <b style="color:var(--gold)">${R[m.premio].nome}</b>. ${R[m.premio].desc}</p>`;}
  else if(e==='fuga'){perdiSanita(D.sanita.fuga);
    h=`<h2>Fuggite</h2><p class="fr">${m.esito_fuga}</p><p>Sanità -${D.sanita.fuga}. Nessuna reliquia.</p>`;}
  else h=`<h2>Il sale brucia</h2><p class="fr">${m.nome} arretra sibilando e vi lascia passare.</p><p>Nessuna reliquia, nessuna ferita.</p>`;
  save();lsan();sub('');
  carta(h+'<button class="primary" id="lvia">Proseguite</button>');
  $('#lvia').onclick=chiudiLotta;
}
function chiudiLotta(){const v=$('#lv');v.pause();v.removeAttribute('src');v.load();
  $('#lotta').classList.remove('on');carta('');lottaAperta=false;const d=LT.dopo;LT=null;aggiornaSanita();d&&d();}

/* gesti: scorrimento in 4 direzioni o tocco */
(()=>{const o=$('#lotta');let x0=0,y0=0;
  o.addEventListener('pointerdown',e=>{if(e.target.closest('.lcard,#lbypass'))return;x0=e.clientX;y0=e.clientY;});
  o.addEventListener('pointerup',e=>{if(e.target.closest('.lcard,#lbypass')||!LT||!LT.aperta)return;const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.max(Math.abs(dx),Math.abs(dy))<28)return mossa('tocco');
    mossa(Math.abs(dx)>Math.abs(dy)?(dx>0?'destra':'sinistra'):(dy>0?'giu':'su'));});
  document.addEventListener('keydown',e=>{if(!LT||!LT.aperta)return;
    const k={ArrowLeft:'sinistra',ArrowRight:'destra',ArrowUp:'su',ArrowDown:'giu',' ':'tocco',Enter:'tocco'}[e.key];if(k){e.preventDefault();mossa(k);}});
})();

/* ================= Musica ================= */
/* Tracce in audio/musica/<nome>.mp3 (genera_musica.py). Web Audio: loop senza stacco, dissolvenze, voce che abbassa la musica.
   Se un file manca, quella traccia è semplicemente silenziosa. */
const MU={on:(()=>{try{return localStorage.getItem('diario_mus_off')!=='1';}catch(e){return true;}})(),buf:{},cur:null,duck:1,master:null,tok:0,sfx:{}};
const TRACCE=['tema','esplorazione','enigma','tensione','sala','vittoria'],EFFETTI=['segno','ok','ko','ruggito','porta'];
function muInit(){if(MU.master)return;try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();
  MU.master=_ac.createGain();MU.master.connect(_ac.destination);muVol();
  EFFETTI.forEach(n=>fetch('audio/sfx/'+n+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>new Promise((ok,ko)=>_ac.decodeAudioData(ab,ok,ko))).then(b=>{MU.sfx[n]=b;}).catch(()=>{}));
  musicaStato();setTimeout(()=>TRACCE.forEach(muBuf),8000);}catch(e){}}
function muVol(){if(!MU.master)return;MU.master.gain.setTargetAtTime(MU.on?MU.duck:0,_ac.currentTime,.25);}
function duck(on){MU.duck=on?.3:1;muVol();}
function muBuf(n){return MU.buf[n]||(MU.buf[n]=fetch('audio/musica/'+n+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})
  .then(ab=>new Promise((ok,ko)=>_ac.decodeAudioData(ab,ok,ko))).catch(()=>null));}
async function musica(n,vol=.5){
  if(!MU.master)return;
  if(MU.cur&&MU.cur.n===n){MU.cur.g.gain.setTargetAtTime(vol,_ac.currentTime,.6);return;}
  const tok=++MU.tok,old=MU.cur;MU.cur=null;
  if(old){old.stop=true;clearTimeout(old.timer);old.g.gain.setTargetAtTime(0,_ac.currentTime,.7);setTimeout(()=>{old.srcs.forEach(s=>{try{s.stop();}catch(e){}});old.g.disconnect();},4000);}
  if(!n)return;const b=await muBuf(n);if(!b||tok!==MU.tok)return;
  const g=_ac.createGain();g.gain.value=0;g.connect(MU.master);g.gain.setTargetAtTime(vol,_ac.currentTime,.9);
  MU.cur={n,g,b,stop:false,timer:null,srcs:[],first:true};muLoop(MU.cur);}
function muLoop(t){if(t.stop)return;const X=Math.min(3,t.b.duration/4),now=_ac.currentTime,d=t.b.duration;
  const s=_ac.createBufferSource();s.buffer=t.b;const v=_ac.createGain();s.connect(v);v.connect(t.g);
  if(t.first){v.gain.setValueAtTime(1,now);t.first=false;}else{v.gain.setValueAtTime(0,now);v.gain.linearRampToValueAtTime(1,now+X);}
  v.gain.setValueAtTime(1,now+d-X);v.gain.linearRampToValueAtTime(0,now+d);
  s.start(now);t.srcs.push(s);s.onended=()=>{const i=t.srcs.indexOf(s);if(i>=0)t.srcs.splice(i,1);};
  t.timer=setTimeout(()=>muLoop(t),(d-X)*1000);}
/* quale traccia per lo stato attuale */
function musicaStato(){
  if(!MU.master)return;
  if(lottaAperta)return musica('tensione',.6);
  if(S&&S.done)return musica('vittoria',.5);
  if(S&&$('#game').classList.contains('on')){
    if(S.idx===D.tappe.length)return musica('sala',.5);
    return S.phase==='enigma'?musica('enigma',.4):musica('esplorazione',S.phase==='scena'?.35:.45);}
  return musica('tema',.55);}
function ricomincia(){if(!confirm('Ricominciare da zero? Perdete i progressi di questa partita.'))return;
  try{localStorage.removeItem(KEY);}catch(e){}location.reload();}
function aggiornaMus(){$('#rst').innerHTML=IC.restart;const b=$('#mus');b.innerHTML=MU.on?IC.speaker:IC.mute;b.setAttribute('aria-pressed',MU.on);b.setAttribute('aria-label',MU.on?'Silenzia la musica':'Riattiva la musica');}
$('#rst').onclick=ricomincia;
$('#mus').onclick=()=>{MU.on=!MU.on;try{localStorage.setItem('diario_mus_off',MU.on?'0':'1');}catch(e){}muInit();muVol();aggiornaMus();};
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>muInit(),{once:true,capture:true}));
/* effetti: usa il campione se c'è, altrimenti il bip sintetico */
function campione(n,vol=.8){const b=MU.sfx[n];if(!b||!_ac||!MU.on)return false;try{const s=_ac.createBufferSource(),g=_ac.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(_ac.destination);s.start();return true;}catch(e){return false;}}

/* ================= Cutscene in pixel art ================= */
/* Disegnate dal codice su una tela 120x160, con la tavolozza del gioco. Le didascalie stanno in storia.json (cutscene). */
const CW=120,CH=160;
const C={ink:'#0a0f0c',bone:'#ece6d6',verd:'#78b18f',gold:'#c8a557',goldL:'#ffdf8a',blood:'#d0665a',wine:'#8a2f3d',sil:'#0c1710',ground:'#09120c'};
const hexv=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixc=(a,b,k)=>{const A=hexv(a),B=hexv(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
const c01=x=>Math.max(0,Math.min(1,x));
const seg=(t,a,b)=>c01((t-a)/(b-a));
const eo=k=>1-(1-k)*(1-k)*(1-k);
let X=null,SKY=['#000','#000'];
const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.max(0,Math.round(w)),Math.max(0,Math.round(h)));};
const disc=(cx,cy,r,c)=>{X.fillStyle=c;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r*.5));X.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);}};
const ell=(cx,cy,rx,ry,c)=>{X.fillStyle=c;for(let dy=-ry;dy<=ry;dy++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-dy*dy/(ry*ry))));X.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);}};
const circ=(cx,cy,r,c)=>{X.fillStyle=c;const n=Math.max(8,Math.ceil(r*6));for(let i=0;i<n;i++){const a=i/n*6.2832;X.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}};
const glow=(x,y,r,c,a)=>{for(let i=4;i>=1;i--){X.globalAlpha=Math.max(0,a)*(1-i/5)*.55;disc(x,y,Math.round(r*i/4),c);}X.globalAlpha=1;};
const sky=(top,bot)=>{SKY=[top,bot];for(let y=0;y<CH;y+=4)R(0,y,CW,4,mixc(top,bot,y/CH));};
const stars=t=>{for(let i=0;i<48;i++){if((i+Math.floor(t*2))%9===0)continue;R((i*53+17)%CW,(i*37+11)%72,1,1,i%5===0?C.gold:C.bone);}};
const moon=(x,y)=>{disc(x,y,7,'#e9e2c8');disc(x+3,y-2,6,mixc(SKY[0],SKY[1],(y-2)/CH));};
const SPC={};
const sprC=n=>SPC[n]||(SPC[n]=(()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
  SPR[n].forEach((row,yy)=>{for(let xx=0;xx<16;xx++){const col=PAL[row[xx]||'.'];if(col){x.fillStyle=col;x.fillRect(xx,yy,1,1);}}});return c;})());
const spr=(n,x,y,s,al=1)=>{X.globalAlpha=al;X.drawImage(sprC(n),Math.round(x),Math.round(y),16*s,16*s);X.globalAlpha=1;};
const bmp=(rows,pal,x,y,s=1,al=1)=>{X.globalAlpha=al;rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col){X.fillStyle=col;X.fillRect(Math.round(x+i*s),Math.round(y+j*s),s,s);}}});X.globalAlpha=1;};
const flash=(a,col='#e8f3e4')=>{if(a<=0)return;X.globalAlpha=Math.min(1,a);R(0,0,CW,CH,col);X.globalAlpha=1;};
const HORSE=["...........mm...","..........mbbb..","........mmbbbb..","..ttbbbbbbbbkb..",".ttbbbbbbbbbbb..","..tbbbbbbbbbb...","...bbbbbbbbbb...","...bbbbbbbbbb...","...bb.bb..bb.bb","...bb.bb..bb.bb","...bb.bb..bb.bb","...dd.dd..dd.dd"];
const HP={m:'#1c120d',b:'#5a3a2a',t:'#2b1b12',k:'#ece6d6',d:'#150d09'};
const CROWN=["g.....g.g.....g","gg...ggggg...gg","ggg.ggggggg.ggg","ggggggggggggggg","gyggyggyggyggyg","ggggggggggggggg"];
const CP={g:'#c8a557',y:'#ffdf8a'};
const GLIFI={V:["X...X","X...X","X...X","X...X",".X.X.",".X.X.","..X.."],O:[".XXX.","X...X","X...X","X...X","X...X","X...X",".XXX."],
  C:[".XXXX","X....","X....","X....","X....","X....",".XXXX"],E:["XXXXX","X....","X....","XXXX.","X....","X....","XXXXX"]};
const lettera=(ch,x,y,s,col)=>{const g=GLIFI[ch];if(!g)return;g.forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==='X')R(x+i*s,y+j*s,s,s,col);});};
const sigillo=(x,y,col,s=1)=>{circ(x,y,9*s,col);circ(x,y,8*s,col);
  const a=[[x,y-7*s],[x+7*s,y+5*s],[x-7*s,y+5*s]];for(let e=0;e<3;e++){const p=a[e],q=a[(e+1)%3],n=Math.round(14*s);for(let i=0;i<=n;i++)R(p[0]+(q[0]-p[0])*i/n,p[1]+(q[1]-p[1])*i/n,1,1,col);}
  disc(x,y+1,Math.max(1,Math.round(1.6*s)),col);};
const colline=(c)=>{R(0,118,CW,42,c);for(let i=0;i<CW;i++)R(i,116+Math.round(Math.sin(i/9)*2+Math.sin(i/23)*3),1,3,c);};
const cipresso=(x,h)=>ell(x,118-h/2,4,h/2,'#06100a');

let CUT=null,droneNodes=null;
function drone(on){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
  if(on&&!droneNodes){const g=_ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.05,_ac.currentTime+1.5);g.connect(_ac.destination);
    const os=[55,82.4,110.7].map((f,i)=>{const o=_ac.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=f;o.detune.value=i*7;o.connect(g);o.start();return o;});droneNodes={g,os};}
  else if(!on&&droneNodes){const d=droneNodes;droneNodes=null;d.g.gain.cancelScheduledValues(_ac.currentTime);d.g.gain.setValueAtTime(d.g.gain.value,_ac.currentTime);d.g.gain.linearRampToValueAtTime(0,_ac.currentTime+.6);setTimeout(()=>d.os.forEach(o=>{try{o.stop();}catch(e){}}),700);}}catch(e){}}
function cutscene(id,dopo){
  const sc=SCENE[id];if(!sc||CUT){dopo&&dopo();return;}
  stopAudio();const o=$('#cut'),cv=$('#cutc');X=cv.getContext('2d');X.imageSmoothingEnabled=false;
  const dida=(D.cutscene&&D.cutscene[id])||[];
  const calmo=matchMedia('(prefers-reduced-motion:reduce)').matches;
  CUT={sc,t0:performance.now(),dopo,last:-1,fired:0,nd:-1,fine:false};
  $('#cuttxt').innerHTML='';$('#cutgo').style.visibility='hidden';$('#cutskip').style.visibility='visible';o.classList.add('on');
  if(id==='intro')musica('tema',.55);else if(id==='finale')musica('sala',.55);
  if(MU.on&&!MU.cur)drone(true);
  const fine=()=>{if(CUT.fine)return;CUT.fine=true;$('#cutgo').style.visibility='visible';$('#cutgo').focus({preventScroll:true});$('#cutskip').style.visibility='hidden';drone(false);};
  const loop=now=>{if(!CUT)return;let t=calmo?sc.dur:(now-CUT.t0)/1000;
    const f=Math.floor(t*14);
    if(f!==CUT.last){CUT.last=f;X.globalAlpha=1;sc.draw(t);
      const n=dida.filter(d=>d[0]<=t).length;
      if(n!==CUT.nd){CUT.nd=n;$('#cuttxt').innerHTML=dida.slice(0,n).map((d,i)=>`<p${i===n-1?' class="nuova"':''}>${d[1]}</p>`).join('');}
      while(CUT.fired<(sc.beats||[]).length&&t>=sc.beats[CUT.fired][0]){suono(sc.beats[CUT.fired][1]);if(sc.beats[CUT.fired][1]!=='segno')vibra(25);CUT.fired++;}}
    if(t>=sc.dur)fine();
    if(!calmo||!CUT.fine)CUT.raf=requestAnimationFrame(loop);};
  CUT.raf=requestAnimationFrame(loop);
}
function saltaCut(){if(!CUT||CUT.fine)return;CUT.t0=performance.now()-CUT.sc.dur*1000;CUT.fired=(CUT.sc.beats||[]).length;}
$('#cutskip').onclick=()=>saltaCut();$('#cutgo').onclick=()=>chiudiCut();

const mgState=t=>S.mg[t.id]||(S.mg[t.id]={});

/* --- Tessere scorrevoli: il sigillo --- */
function mountTessere(el,t){
  const st=mgState(t);
  if(!st.b){let b=[0,1,2,3,4,5,6,7,8],bl=8,last=-1;
    for(let i=0;i<90;i++){const r=Math.floor(bl/3),c=bl%3,nb=[];
      if(r>0)nb.push(bl-3);if(r<2)nb.push(bl+3);if(c>0)nb.push(bl-1);if(c<2)nb.push(bl+1);
      const ok=nb.filter(x=>x!==last),m=ok[Math.floor(Math.random()*ok.length)];[b[bl],b[m]]=[b[m],b[bl]];last=bl;bl=m;}
    if(b.every((v,i)=>v===i)){[b[7],b[8]]=[b[8],b[7]];}
    st.b=b;save();}
  el.innerHTML='<canvas id="tiles" width="300" height="300" aria-label="Puzzle a tessere: il sigillo spezzato"></canvas><p class="cap" id="cap"></p>';
  const cv=$('#tiles'),cx=cv.getContext('2d'),off=document.createElement('canvas');off.width=off.height=300;
  const oc=off.getContext('2d');VILLA.forEach((row,y)=>{for(let x=0;x<15;x++){oc.fillStyle=VP[row[x]];oc.fillRect(x*20,y*20,20,20);}});
  const paint=()=>{cx.fillStyle='#0a0f0c';cx.fillRect(0,0,300,300);
    st.b.forEach((pc,pos)=>{if(pc===8&&!st.solved)return;const sx=(pc%3)*100,sy=Math.floor(pc/3)*100,dx=(pos%3)*100,dy=Math.floor(pos/3)*100;
      cx.drawImage(off,sx,sy,100,100,dx,dy,100,100);});
    if(!st.solved){cx.strokeStyle='#0a0f0c';cx.lineWidth=3;for(let i=1;i<3;i++){cx.beginPath();cx.moveTo(i*100,0);cx.lineTo(i*100,300);cx.moveTo(0,i*100);cx.lineTo(300,i*100);cx.stroke();}}};
  const cap=()=>{$('#cap').textContent=st.solved?'Il sigillo è intero.':'Toccate una tessera accanto al vuoto.';$('#cap').className='cap'+(st.solved?' won':'');};
  paint();cap();
  cv.onclick=e=>{if(st.solved)return;const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*3),y=Math.floor((e.clientY-r.top)/r.height*3),pos=y*3+x,bl=st.b.indexOf(8);
    const adj=Math.abs(pos-bl)===3||(Math.abs(pos-bl)===1&&Math.floor(pos/3)===Math.floor(bl/3));if(!adj)return;
    [st.b[pos],st.b[bl]]=[st.b[bl],st.b[pos]];
    if(st.b.every((v,i)=>v===i)){st.solved=true;sbloccaInput();}
    save();paint();cap();};
}

/* --- Ruota cifrata --- */
const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function mountRuota(el,t){
  const st=mgState(t);let k=st.k||0;const step=360/26,C=150;
  const ring=(R,cls)=>[...AL].map((ch,i)=>`<text class="${cls}" transform="translate(${C} ${C}) rotate(${i*step}) translate(0 ${-R})" text-anchor="middle" font-size="${cls==='o'?17:16}">${ch}</text>`).join('');
  el.innerHTML=`<svg class="dial" id="dial" viewBox="0 0 300 300" role="img" aria-label="Ruota cifrata: anello esterno fisso, anello interno da girare">
    <circle cx="150" cy="150" r="140" fill="#0a0f0c" stroke="#2c4234" stroke-width="2"/>
    <circle cx="150" cy="150" r="104" fill="#111a14" stroke="#2c4234" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="66" fill="#0a0f0c" stroke="#2c4234" stroke-width="1.5"/>
    <g class="out">${ring(116,'o')}</g><g id="ring" class="in" style="transform:rotate(${k*step}deg)">${ring(80,'i')}</g></svg>
    <div class="decode" aria-live="polite"><span class="a">${t.cifrato}</span><span class="a">→</span><span class="b" id="dec"></span></div>
    <div class="dialctl"><button id="dl" aria-label="Gira a sinistra">${IC.left}</button><button id="dr" aria-label="Gira a destra">${IC.right}</button></div>
    <p class="cap">Girate l'anello interno: sotto ogni lettera cifrata compare quella vera.</p>`;
  const dec=()=>t.cifrato.split('').map(c=>AL[(AL.indexOf(c)-k+26)%26]).join('');
  const set=(n,anim=true)=>{const nk=((n%26)+26)%26;if(nk!==k)tick();k=nk;st.k=k;save();const g=$('#ring');g.classList.toggle('drag',!anim);g.style.transform=`rotate(${k*step}deg)`;$('#dec').textContent=dec();};
  $('#dec').textContent=dec();$('#dl').onclick=()=>set(k-1);$('#dr').onclick=()=>set(k+1);
  const dial=$('#dial');let a0=null,k0=0,acc=0,prev=0;
  const ang=e=>{const r=dial.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;};
  dial.onpointerdown=e=>{prev=ang(e);acc=0;k0=k;dial.setPointerCapture(e.pointerId);a0=1;};
  dial.onpointermove=e=>{if(a0===null)return;let a=ang(e),d=a-prev;if(d>180)d-=360;if(d<-180)d+=360;prev=a;acc+=d;set(k0+Math.round(acc/step),false);};
  dial.onpointerup=dial.onpointercancel=()=>{a0=null;$('#ring').classList.remove('drag');};
  dial.onkeydown=e=>{if(e.key==='ArrowLeft')set(k-1);if(e.key==='ArrowRight')set(k+1);};
}

/* tick tattile + sonoro per le ruote */

function tick(){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
  try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();
    o.frequency.value=900;g.gain.setValueAtTime(.04,_ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+.04);
    o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+.05);}catch(e){}}

    <p class="cap" id="cap"></p>`;
  const paint=()=>{cap.forEach((c,i)=>{$('#w'+i).style.height=(st.v[i]/c*100)+'%';$('#n'+i).textContent=st.v[i];});
    $('#cap').textContent=st.solved?`Quattro litri esatti, in ${st.m} mosse.`:`Mosse: ${st.m}. Serve 4 litri nel barile da 5.`;$('#cap').className='cap'+(st.solved?' won':'');
    el.querySelectorAll('button').forEach(b=>b.disabled=!!st.solved);};
  paint();
  el.onclick=e=>{const b=e.target.closest('button');if(!b||st.solved)return;const i=+b.dataset.i,o=1-i,v=st.v;
    if(b.dataset.a==='fill')v[i]=cap[i];else if(b.dataset.a==='empty')v[i]=0;
    else{const q=Math.min(v[i],cap[o]-v[o]);v[i]-=q;v[o]+=q;}
    st.m++;if(v[1]===4){st.solved=true;sbloccaInput();}save();paint();};
}
</script>
</body>
</html>
