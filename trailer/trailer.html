<style>html,body{margin:0;background:#000;height:100%}body{display:flex;align-items:center;justify-content:center}canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;image-rendering:pixelated;display:block}</style></head>
<body><canvas id="c" width="320" height="180"></canvas>
<script>
/* Trailer da 45 s, 320x180, disegnato dal codice con gli sprite del gioco (../frascati/index.html).
   Si vede nel browser (parte da solo, ?t=12.5 mostra un fotogramma) e si esporta in MP4 con render.js. */
const W=320,H=180,DUR=45,cv=document.getElementById('c'),X=cv.getContext('2d',{willReadFrequently:true});
let SPR,PAL,VILLA,VP,HORSE,HP,CROWN,CP;
function grab(src,name){const i=src.indexOf('const '+name+'=');let j=src.indexOf('=',i)+1,d=0,k=j,ins=null;
  for(;k<src.length;k++){const ch=src[k];if(ins){if(ch===ins&&src[k-1]!=='\\')ins=null;continue;}
    if(ch==='"'||ch==="'"||ch==='`'){ins=ch;continue;}
    if('[{('.includes(ch))d++;else if('])}'.includes(ch)){d--;if(d===0){k++;break;}}}
  return eval('('+src.slice(j,k)+')');}

/* ---------- utilità ---------- */
const C={ink:'#05060a',bone:'#ece6d6',verd:'#78b18f',gold:'#c8a557',goldL:'#ffdf8a',blood:'#d0665a',wine:'#8a2f3d',pink:'#ff4fd8',cyan:'#4ff3ff',purp:'#7a3cff',org:'#ff9a3c',yel:'#ffe66d',neon:'#39ff9a'};
const hexv=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mixc=(a,b,k)=>{const A=hexv(a),B=hexv(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';};
const c01=x=>Math.max(0,Math.min(1,x)),K=(t,a,b)=>c01((t-a)/(b-a)),eo=k=>1-(1-k)*(1-k)*(1-k),ei=k=>k*k*k;
const rn=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.max(0,Math.round(w)),Math.max(0,Math.round(h)));};
const disc=(cx,cy,r,c)=>{X.fillStyle=c;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy+r*.5)));X.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);}};
const ell=(cx,cy,rx,ry,c)=>{X.fillStyle=c;for(let dy=-ry;dy<=ry;dy++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-dy*dy/(ry*ry))));X.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);}};
const circ=(cx,cy,r,c,th=1)=>{X.fillStyle=c;const n=Math.max(8,Math.ceil(r*6));for(let i=0;i<n;i++){const a=i/n*6.2832;X.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),th,th);}};
const line=(x0,y0,x1,y1,c,th=1)=>{X.fillStyle=c;const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)));for(let i=0;i<=n;i++){const k=n?i/n:0;X.fillRect(Math.round(x0+(x1-x0)*k),Math.round(y0+(y1-y0)*k),th,th);}};
const glow=(x,y,r,c,a)=>{for(let i=4;i>=1;i--){X.globalAlpha=Math.max(0,a)*(1-i/5)*.6;disc(x,y,Math.round(r*i/4),c);}X.globalAlpha=1;};
const flash=(a,c='#ffffff')=>{if(a<=0)return;X.globalAlpha=Math.min(1,a);R(0,0,W,H,c);X.globalAlpha=1;};
const skyg=(top,bot,y0=0,y1=H)=>{SKY=[top,bot];for(let y=y0;y<y1;y+=3)R(0,y,W,3,mixc(top,bot,(y-y0)/(y1-y0)));};let SKY=['#000','#000'];
const stars=(t,n=70,hmax=100)=>{for(let i=0;i<n;i++){if((i+Math.floor(t*3))%9===0)continue;R((i*53+17)%W,(i*37+11)%hmax,1,1,i%5===0?C.goldL:'#cfd8ff');}};
const SC_={};const cvs=(rows,pal)=>{const c=document.createElement('canvas');c.width=Math.max(...rows.map(r=>r.length));c.height=rows.length;const x=c.getContext('2d');rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}});return c;};
const bmpc=(id,rows,pal)=>SC_[id]||(SC_[id]=cvs(rows,pal));
const img=(c,x,y,sx,sy=sx,flip=false,al=1)=>{X.globalAlpha=al;X.save();X.translate(Math.round(x)+(flip?c.width*sx:0),Math.round(y));X.scale(flip?-1:1,1);X.imageSmoothingEnabled=false;X.drawImage(c,0,0,c.width*sx,c.height*sy);X.restore();X.globalAlpha=1;};
const sp=(n,x,y,s,flip=false,al=1,sy=s)=>img(bmpc('s_'+n,SPR[n],PAL),x,y,s,sy,flip,al);
/* eroi: due giocatori */
const HP2={k:'#2b1b12',s:'#e8c9a0',c:'#e0603a',b:'#3f6fc4',p:'#2a3646',d:'#150d09',y:'#ffdf8a',g:'#9dffb8',w:'#eeeeee',h:'#f2c14e'};
const HERO=(coat,fr,acc)=>["................",".....kkkkk......","....kkkkkkk.....","....ksssssk.....","....sskssk......","....ssssss......",`....${coat}${coat}${coat}${coat}${coat}${coat}.${acc}${acc}...`,`...${coat}${coat}${coat}${coat}${coat}${coat}${coat}${acc}${acc}....`,`...${coat}${coat}${coat}${coat}${coat}${coat}${coat}......`,`...${coat}${coat}${coat}${coat}${coat}${coat}${coat}${coat}.....`,"....pppppp......",fr?"....pppppp......":"....pp..pp......",fr?".....pp.pp......":"...pp....pp.....",fr?".....dd..dd.....":"...dd....dd.....","................","................"];
const hero=(who,fr,x,y,s,flip=false,al=1)=>img(bmpc('h'+who+fr,HERO(who?'b':'c',fr,who?'g':'y'),HP2),x,y,s,s,flip,al);
/* font 5x7 */
const F={};(s=>{s.split('|').forEach(g=>{const [ch,...rows]=g.split(',');F[ch]=rows;});})(
"A,.XXX.,X...X,X...X,XXXXX,X...X,X...X,X...X|B,XXXX.,X...X,X...X,XXXX.,X...X,X...X,XXXX.|C,.XXXX,X....,X....,X....,X....,X....,.XXXX|D,XXXX.,X...X,X...X,X...X,X...X,X...X,XXXX.|E,XXXXX,X....,X....,XXXX.,X....,X....,XXXXX|F,XXXXX,X....,X....,XXXX.,X....,X....,X....|G,.XXXX,X....,X....,X.XXX,X...X,X...X,.XXXX|H,X...X,X...X,X...X,XXXXX,X...X,X...X,X...X|I,XXXXX,..X..,..X..,..X..,..X..,..X..,XXXXX|J,..XXX,...X.,...X.,...X.,...X.,X..X.,.XX..|K,X...X,X..X.,X.X..,XX...,X.X..,X..X.,X...X|L,X....,X....,X....,X....,X....,X....,XXXXX|M,X...X,XX.XX,X.X.X,X.X.X,X...X,X...X,X...X|N,X...X,XX..X,X.X.X,X..XX,X...X,X...X,X...X|O,.XXX.,X...X,X...X,X...X,X...X,X...X,.XXX.|P,XXXX.,X...X,X...X,XXXX.,X....,X....,X....|Q,.XXX.,X...X,X...X,X...X,X.X.X,X..X.,.XX.X|R,XXXX.,X...X,X...X,XXXX.,X.X..,X..X.,X...X|S,.XXXX,X....,X....,.XXX.,....X,....X,XXXX.|T,XXXXX,..X..,..X..,..X..,..X..,..X..,..X..|U,X...X,X...X,X...X,X...X,X...X,X...X,.XXX.|V,X...X,X...X,X...X,X...X,.X.X.,.X.X.,..X..|W,X...X,X...X,X...X,X.X.X,X.X.X,XX.XX,X...X|X,X...X,X...X,.X.X.,..X..,.X.X.,X...X,X...X|Y,X...X,X...X,.X.X.,..X..,..X..,..X..,..X..|Z,XXXXX,....X,...X.,..X..,.X...,X....,XXXXX|0,.XXX.,X...X,X..XX,X.X.X,XX..X,X...X,.XXX.|1,..X..,.XX..,..X..,..X..,..X..,..X..,.XXX.|2,.XXX.,X...X,....X,...X.,..X..,.X...,XXXXX|3,XXXX.,....X,....X,.XXX.,....X,....X,XXXX.|4,...X.,..XX.,.X.X.,X..X.,XXXXX,...X.,...X.|5,XXXXX,X....,XXXX.,....X,....X,X...X,.XXX.|6,.XXX.,X....,X....,XXXX.,X...X,X...X,.XXX.|7,XXXXX,....X,...X.,..X..,.X...,.X...,.X...|8,.XXX.,X...X,X...X,.XXX.,X...X,X...X,.XXX.|9,.XXX.,X...X,X...X,.XXXX,....X,....X,.XXX.|.,.....,.....,.....,.....,.....,.XX..,.XX..|!,..X..,..X..,..X..,..X..,..X..,.....,..X..|?,.XXX.,X...X,....X,...X.,..X..,.....,..X..|,,.....,.....,.....,.....,.XX..,..X..,.X...|-,.....,.....,.....,XXXXX,.....,.....,.....|:,.....,.XX..,.XX..,.....,.XX..,.XX..,.....|',.XX..,..X..,.X...,.....,.....,.....,.....|/,....X,....X,...X.,..X..,.X...,X....,X....|>,X....,XX...,XXX..,XXXX.,XXX..,XX...,X....|*,.....,X.X.X,.XXX.,XXXXX,.XXX.,X.X.X,.....| ,.....,.....,.....,.....,.....,.....,.....");
const CHROME=['#ffffff','#c8f6ff','#6fd3ff','#2f7bff','#a24cff','#ff4fd8','#ff9a3c'];
const tw=(s,sc)=>s.length*6*sc-sc;
/* testo: opts {c:centrato, col:string|array, out, sh, al} */
function txt(s,x,y,sc,o={}){
  if(o.c)x=Math.round(x-tw(s,sc)/2);
  const pass=(dx,dy,col)=>{for(let n=0;n<s.length;n++){const g=F[s[n]]||F[' '];for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(g[j][i]==='X'){X.fillStyle=Array.isArray(col)?col[j]:col;X.fillRect(Math.round(x+n*6*sc+i*sc+dx),Math.round(y+j*sc+dy),sc,sc);}}};
  X.globalAlpha=o.al??1;
  if(o.sh)pass(sc,sc,o.sh);
  if(o.out){const t=o.ot||1;for(const [a,b] of [[-t,0],[t,0],[0,-t],[0,t],[-t,-t],[t,t],[-t,t],[t,-t]])pass(a,b,o.out);}
  pass(0,0,o.col||'#fff');X.globalAlpha=1;}
/* testo che entra con una "botta" */
function slam(s,x,y,sc,k,o={}){const p=eo(k);if(k<=0)return;const big=1+(1-p)*2;txt(s,x,y-(big-1)*sc*3.5,Math.max(1,Math.round(sc*big)),{...o,c:true,al:Math.min(1,k*5)});}
const slamw=(str,x,y,sc,t,a,b,o)=>{if(t>=a&&t<b)slam(str,x,y,sc,K(t,a,a+.3),{...o,al:undefined});};
/* effetti */
function boom(x,y,k,size,col=0){if(k<=0||k>=1)return;const r=Math.round(size*eo(k)),a=1-ei(k);X.globalAlpha=a;
  const P=col?['#ffffff','#9dffb8','#39ff9a','#1d9a6a']:['#ffffff','#ffe66d','#ff9a3c','#d0302a'];
  disc(x,y,r,P[3]);disc(x,y,Math.round(r*.8),P[2]);disc(x,y,Math.round(r*.55),P[1]);disc(x,y,Math.round(r*.3*(1-k)),P[0]);
  for(let i=0;i<16;i++){const an=rn(i+x)*6.28,d=size*(.7+rn(i*3+y)*1.1)*eo(k);R(x+Math.cos(an)*d,y+Math.sin(an)*d,2,2,i%3?P[1]:P[0]);}X.globalAlpha=1;}
function bolt(x,seed,col='#ffffff'){let cx=x,cy=0;while(cy<110){const nx=cx+(rn(seed+cy)-.5)*22,ny=cy+6+rn(seed*2+cy)*10;line(cx,cy,nx,ny,col,2);cx=nx;cy=ny;if(rn(seed+cy*3)>.82)line(cx,cy,cx+(rn(cy)-.5)*40,cy+22,col,1);}}
function speed(t,col='#ffffff',n=34,a=.35,cx=160,cy=90){X.globalAlpha=a;for(let i=0;i<n;i++){const an=rn(i*7.7)*6.2832,r0=40+((rn(i)*80+t*260)%140),r1=r0+30+rn(i+9)*40;line(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0*.7,cx+Math.cos(an)*r1,cy+Math.sin(an)*r1*.7,col);}X.globalAlpha=1;}
function gridg(t,hy,col,sp=1){R(0,hy,W,H-hy,'#10031c');
  for(let i=0;i<16;i++){const z=((i+(t*sp*1.5)%1)/16),y=hy+Math.pow(z,2.1)*(H-hy);R(0,y,W,1,mixc('#2a0a4a',col,z));}
  for(let k=-14;k<=14;k++)line(160,hy,160+k*46,H,mixc('#2a0a4a',col,.55));
  R(0,hy,W,1,col);}
function sun(cx,cy,r,t){for(let dy=-r;dy<=r;dy++){if(dy>0&&((dy+Math.floor(t*6))%8)<Math.floor(dy/(r/6))+1)continue;const w=Math.floor(Math.sqrt(r*r-dy*dy));R(cx-w,cy+dy,w*2+1,1,mixc('#fff27a','#ff2f8e',(dy+r)/(2*r)));}}
function skyline(y,seed,col){for(let x=0;x<W;x+=9){const h=10+rn(Math.floor(x/9)+seed)*30;R(x,y-h,9,h,col);if(rn(x+seed)>.55)R(x+3,y-h-5,3,5,col);}}
/* il mondo del gioco */
const SIL='#0d1a12',WALL='#22372a',WALL2='#2f4a38';
function villa(cx,base,s,t,warm=1){const u=s,x0=cx-32*u;R(x0,base-34*u,64*u,34*u,WALL);for(let r=0;r<14;r++){const w=Math.round((2+r*2.4)*u);R(cx-w,base-(34+14)*u+r*u,w*2,Math.ceil(u),r<1?WALL2:'#18291f');}
  R(x0-22*u,base-20*u,18*u,20*u,WALL);R(cx+32*u+4*u,base-20*u,18*u,20*u,WALL);R(x0,base-34*u,64*u,Math.max(1,u),WALL2);
  [[-24,-26],[-6,-26],[12,-26],[-44,-14],[52,-14]].forEach(([dx,dy],i)=>{const on=Math.sin(t*5+i*2.3)>-.7;R(cx+dx*u,base+dy*u,8*u,9*u,on?mixc('#3a2f16',C.gold,warm):'#3a2f16');});
  R(cx-5*u,base-16*u,10*u,16*u,'#1a0f0a');}
function cipr(x,base,h){ell(x,base-h/2,4,h/2,'#06100a');}
function moon(x,y,r=7){disc(x,y,r,'#e9e2c8');disc(x+Math.round(r*.45),y-Math.round(r*.3),Math.round(r*.85),mixc(SKY[0],SKY[1],y/H));}
function door(cx,top,w,h,open=0,glowk=0,t=0){const x0=cx-w/2;
  R(x0-6,top-6,w+12,h+6,'#2f3a35');ell(cx,top,w/2+6,Math.round(w/2*.9)+6,'#2f3a35');
  R(x0,top,w,h,'#1b1410');ell(cx,top,w/2,Math.round(w/2*.9),'#1b1410');
  for(let i=1;i<6;i++)R(x0+i*w/6,top-w*.4,1,h+w*.4,'#2a1f17');R(x0,top+h*.35,w,3,'#3a2b1c');R(x0,top+h*.75,w,3,'#3a2b1c');
  if(glowk>0){for(let i=0;i<5;i++){const k=rn(i+3);X.globalAlpha=glowk*(.5+.3*Math.sin(t*9+i));R(x0+(i+.5)*w/5.2,top-w*.35,1+Math.round(glowk*2),h+w*.35,C.neon);}X.globalAlpha=1;}}
function eye(cx,cy,rx,ry,op,t){if(op<=0)return;glow(cx,cy,rx*1.3,C.neon,.35+.1*Math.sin(t*4));const h=Math.max(1,Math.round(ry*op));ell(cx,cy,rx,h,'#e3efd8');
  const ix=Math.round(Math.sin(t*1.4)*rx*.12);disc(cx+ix,cy,Math.round(h*.8),C.neon);disc(cx+ix,cy,Math.round(h*.5),'#0f6a45');R(cx+ix-1,cy-Math.round(h*.8),3,Math.round(h*1.6),'#021208');
  R(cx-rx,cy-h-1,rx*2,2,'#10261a');R(cx-rx,cy+h,rx*2,2,'#10261a');}
function crown(x,y,s){img(bmpc('crown',CROWN,CP),x,y,s);}

/* ---------- scene ---------- */
const IMP=[[3.5,.5,.5],[6.0,.5,.5],[9.0,1,1.1],[12.4,.5,.4],[14.3,.8,.5],[15.3,.8,.5],[16.3,.8,.5],[19.7,.5,.4],[23.0,.8,.5],[24.5,.8,.5],[26.0,1,.6],[27.4,1,.8],[33.0,1,.6],[34.2,1,.6],[35.4,1,.6],[36.5,1,.6],[44.0,1,.7]];
const imp=t=>IMP.reduce((m,[ti,p,d])=>Math.max(m,t>=ti?p*Math.max(0,1-(t-ti)/d):0),0);

function sA(t){ /* VHS e tramonto synthwave */
  if(t<.55){R(0,0,W,H,'#1a1a1f');for(let i=0;i<900;i++){const v=Math.floor(rn(i*1.7+Math.floor(t*24)*13)*255);R(rn(i*3.1+Math.floor(t*24))*W,rn(i*5.3+Math.floor(t*24)*7)*H,2,1,`rgb(${v},${v},${v})`);}
    txt('>PLAY',14,12,1,{col:'#fff',out:'#000'});const by=((t*400)%H);R(0,by,W,6,'rgba(255,255,255,.2)');return;}
  skyg('#12033a','#ff4f9a',0,104);sun(160,92,40,t);skyline(104,3,'#1a0630');gridg(t,104,C.pink,1);
  const k=K(t,.7,1.5);txt('STORIES ALIVE',160,34,3,{c:1,col:CHROME,out:'#2a0a4a',sh:C.pink,al:k});
  const k2=K(t,1.4,2);txt('PRESENTS',160,62,1,{c:1,col:'#fff',out:'#2a0a4a',al:k2});
  txt('AN ACTION-PACKED MIDNIGHT ADVENTURE',160,160,1,{c:1,col:C.cyan,out:'#10031c',al:K(t,1.5,2)*.9});
}
function sB(t,d){ /* Frascati 1603 */
  const k=t/d,s=1+k*.7;skyg('#03050a','#112a3e');stars(t);moon(262,26,8);
  R(0,100,W,80,'#07100b');for(let i=0;i<W;i++)R(i,98+Math.round(Math.sin(i/14)*2+Math.sin(i/37)*4),1,6,'#07100b');
  cipr(30,130,60);cipr(292,130,66);cipr(52,130,40);cipr(270,130,44);
  villa(160,128,s,t);R(0,128,W,52,'#0b160f');for(let i=0;i<8;i++)R(0,132+i*7,W,1,'#10211a');
  /* il cardinale cammina verso la porta */
  const p=K(t,.2,3.8),cx=-30+p*190,bob=(p>0&&p<1)?Math.floor(t*7)%2:0;
  const dg=K(t,3.6,4.4);if(dg>0){glow(160,126,12+dg*26,C.neon,dg*.9);}
  sp('cardinale',cx,128-52-bob+22,4,false,1-K(t,3.9,4.7));
  const L1=t>.7&&t<1.1,L2=t>3.3&&t<3.65;if(L1)bolt(70,11);if(L2)bolt(250,29);flash(L1||L2?.55:0);
  txt('FRASCATI. 1603.',12,152,2,{col:'#fff',out:'#000',al:K(t,.3,.7)});
  txt('ONE CARDINAL. ONE FORBIDDEN DOOR.',12,168,1,{col:C.goldL,out:'#000',al:K(t,2.2,2.6)});
}
function sC(t,d){ /* la porta salta */
  const bur=1.6;
  if(t<bur){R(0,0,W,H,'#0a0e0c');for(let i=0;i<10;i++)R(0,i*18,W,1,'#10181a');
    const g=K(t,0,bur);const sh=Math.round((rn(Math.floor(t*30))-.5)*g*6);X.save();X.translate(sh,0);door(160,26,110,150,0,.3+g*.7,t);glow(160,100,60+g*30,C.neon,g*.5);X.restore();
    txt('IT OPENS...',160,10,2,{c:1,col:C.neon,out:'#021208',al:K(t,.5,.8)});return;}
  const u=t-bur;skyg('#02040a','#0b2a22');stars(t,60,90);
  /* nuvole */
  for(let i=0;i<6;i++){const cx=(i*70+u*8)%W,cy=20+i*7;ell(cx,cy,50,8,'rgba(20,50,45,.6)');}
  R(0,128,W,52,'#08140f');villa(160,128,1.4,t,1);
  const bw=Math.round(8+K(u,0,.4)*14);X.globalAlpha=.35;R(160-bw,0,bw*2,126,C.neon);X.globalAlpha=.8;R(160-Math.round(bw*.4),0,Math.round(bw*.8),126,'#d9ffe8');X.globalAlpha=1;glow(160,126,50,C.neon,.9);
  for(let i=0;i<26;i++){const k=u*1.1,an=-1.57+(rn(i)-.5)*2.4,sp_=60+rn(i*3)*120;const x=160+Math.cos(an)*sp_*k,y=126+Math.sin(an)*sp_*k+k*k*40;R(x,y,3,2,'#6b4a2a');}
  eye(160,44,70,26,K(u,.5,1.5),t);
  if(u<.3)flash(.9*(1-u/.3),'#d9ffe8');
  slam('TONIGHT...',160,92,3,K(u,.9,1.3),{col:CHROME,out:'#000',sh:C.pink});
}
/* montaggio: 4 enigmi */
const KPATH=[[1,0],[0,2],[1,4],[3,3],[4,1],[2,2]];

const VG=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(x-160)/160,dy=(y-90)/90;VG[y*W+x]=1-.38*Math.min(1,(dx*dx+dy*dy)/1.6);}
function post(t,im){const f=X.getImageData(0,0,W,H),s=f.data,o=new Uint8ClampedArray(s.length),ca=1+Math.round(im*3),fr=Math.floor(t*24);

    for(let x=0;x<W;x++){const i=(y*W+x)*4,xr=Math.min(W-1,Math.max(0,x-ca+dx)),xb=Math.min(W-1,Math.max(0,x+ca+dx)),v=VG[y*W+x]*sl;
      o[i]=s[(y*W+xr)*4]*v;o[i+1]=s[(y*W+Math.min(W-1,Math.max(0,x+dx)))*4+1]*v;o[i+2]=s[(y*W+xb)*4+2]*v;o[i+3]=255;}}
